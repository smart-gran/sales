<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavique 売上確認</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf8f5; --warm-white: #fff9f5; --blush: #e8d5c8; --rose: #c9a090;
  --deep-rose: #a0695a; --mauve: #7d5a6a; --deep: #3d2b35; --text: #2c1f26;
  --muted: #8a7070; --border: #e0cfc8; --light-border: #efe6e0; --accent: #c9847a;
  --success: #7aaa8a; --warning: #d4a85a;
  --shadow: 0 2px 12px rgba(61,43,53,0.08); --shadow-lg: 0 8px 32px rgba(61,43,53,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

.app-header { background: var(--deep); color: white; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 16px rgba(0,0,0,0.2); }
.header-title { font-family: 'Noto Serif JP', serif; font-size: 18px; font-weight: 500; letter-spacing: 0.05em; }
.header-sub { font-size: 11px; color: var(--blush); margin-top: 2px; letter-spacing: 0.08em; }
.admin-badge { font-size: 11px; background: var(--deep-rose); color: white; padding: 3px 10px; border-radius: 12px; font-weight: 600; display: none; }

/* ログイン */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 70px); padding: 32px 20px; }
.login-card { background: white; border-radius: 16px; box-shadow: var(--shadow-lg); padding: 40px 36px; width: 100%; max-width: 400px; }
.login-card h2 { font-family: 'Noto Serif JP', serif; font-size: 17px; font-weight: 500; color: var(--deep); margin-bottom: 28px; text-align: center; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.form-group label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.form-group input { padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--text); background: var(--warm-white); outline: none; transition: all 0.2s; }
.form-group input:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(201,160,144,0.15); }
.btn-login { width: 100%; padding: 13px; background: var(--deep-rose); color: white; border: none; border-radius: 10px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
.btn-login:hover { background: var(--mauve); transform: translateY(-1px); }
.login-err { color: #c05050; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

/* メイン共通 */
#main-screen { display: none; padding: 28px 24px; max-width: 900px; margin: 0 auto; }
.welcome { font-family: 'Noto Serif JP', serif; font-size: 20px; font-weight: 500; color: var(--deep); margin-bottom: 24px; }
.welcome span { color: var(--deep-rose); }

.summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
.summary-item { background: white; border-radius: 12px; border: 1px solid var(--light-border); box-shadow: var(--shadow); padding: 16px 20px; text-align: center; }
.summary-item .s-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.summary-item .s-value { font-size: 20px; font-weight: 600; color: var(--deep); font-family: 'Noto Serif JP', serif; }
.summary-item .s-value.unpaid { color: var(--warning); }

.card { background: white; border-radius: 12px; border: 1px solid var(--light-border); box-shadow: var(--shadow); padding: 24px 28px; margin-bottom: 20px; }
.card-title { font-family: 'Noto Serif JP', serif; font-size: 15px; font-weight: 500; color: var(--deep); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--light-border); }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--light-border); text-transform: uppercase; letter-spacing: 0.05em; }
td { padding: 13px 12px; border-bottom: 1px solid var(--light-border); font-size: 14px; }
tr:last-child td { border-bottom: none; }
.badge-paid { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #e8f5ee; color: #3a8a5a; }
.badge-unpaid { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #fff6e0; color: #a07010; }
.amount { font-weight: 600; }
.logout-btn { background: none; border: 1px solid var(--blush); color: var(--muted); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; }
.logout-btn:hover { background: var(--blush); color: var(--deep); }

/* 管理者ビュー */
.seller-row { cursor: pointer; transition: background 0.15s; }
.seller-row:hover td { background: var(--cream); }
.seller-row td:first-child { font-weight: 600; color: var(--deep-rose); }
.detail-row { display: none; }
.detail-row td { padding: 0; }
.detail-inner { background: var(--cream); border-top: 1px solid var(--light-border); }
.detail-inner table { background: transparent; }
.detail-inner th { background: transparent; font-size: 10px; }
.detail-inner td { font-size: 13px; padding: 9px 14px; }
.toggle-icon { float: right; color: var(--muted); font-size: 12px; }

#loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
#error-msg { text-align: center; padding: 60px 20px; color: #c05050; font-size: 14px; display: none; }

@media (max-width: 480px) {
  .app-header { padding: 14px 18px; }
  .login-card { padding: 28px 20px; }
  #main-screen { padding: 20px 16px; }
  .summary-bar { grid-template-columns: 1fr 1fr; }
  td, th { padding: 9px 8px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="header-title">Lavique 委託販売</div>
    <div class="header-sub">売上確認ページ</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="admin-badge" id="admin-badge">管理者</span>
    <button class="logout-btn" id="logout-btn" style="display:none" onclick="logout()">ログアウト</button>
  </div>
</div>

<div id="loading">データを読み込んでいます…</div>
<div id="error-msg">データの読み込みに失敗しました。<br>管理者にお問い合わせください。</div>

<div id="login-screen" style="display:none">
  <div class="login-card">
    <h2>🔑 ログイン</h2>
    <div class="form-group">
      <label>ID</label>
      <input type="text" id="login-id" placeholder="ログインIDを入力" autocomplete="username">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="login-pw" placeholder="パスワードを入力" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="login-err">IDまたはパスワードが正しくありません</div>
  </div>
</div>

<div id="main-screen"></div>

<script>
let viewData = null;
let isAdmin = false;

async function loadData() {
  try {
    const res = await fetch('./sales_data.json?v=' + Date.now());
    if (!res.ok) throw new Error('fetch failed');
    viewData = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
  }
}

function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('login-err');
  if (!viewData) return;

  // 管理者チェック
  if (viewData.admin && id === viewData.admin.loginId && pw === viewData.admin.loginPw) {
    err.style.display = 'none';
    isAdmin = true;
    showAdminScreen();
    return;
  }

  // 販売者チェック
  const seller = viewData.sellers.find(s => s.loginId === id && s.loginPw === pw);
  if (!seller) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  isAdmin = false;
  showSellerScreen(seller);
}

// ===== 販売者ビュー =====
function showSellerScreen(s) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'block';
  document.getElementById('admin-badge').style.display = 'none';

  const months = (s.months || []).slice().sort((a,b) => b.monthId.localeCompare(a.monthId));
  const totalRevenue = months.reduce((sum,m) => sum + m.revenue, 0);
  const totalPayout  = months.reduce((sum,m) => sum + m.payout, 0);
  const unpaidCount  = months.filter(m => !m.paid).length;

  const ms = document.getElementById('main-screen');
  ms.style.display = 'block';
  ms.innerHTML = `
    <div class="welcome">こんにちは、<span>${s.name}</span>さん</div>
    <div class="summary-bar">
      <div class="summary-item"><div class="s-label">累計売上</div><div class="s-value">¥${totalRevenue.toLocaleString()}</div></div>
      <div class="summary-item"><div class="s-label">累計振込額</div><div class="s-value">¥${totalPayout.toLocaleString()}</div></div>
      <div class="summary-item"><div class="s-label">未精算月</div><div class="s-value unpaid">${unpaidCount}ヶ月</div></div>
    </div>
    <div class="card">
      <div class="card-title">📅 月別売上・精算状況</div>
      <table>
        <thead><tr><th>月</th><th style="text-align:right">売上</th><th style="text-align:right">振込額</th><th style="text-align:center">精算状況</th></tr></thead>
        <tbody>${months.length ? months.map(m=>`
          <tr>
            <td style="font-weight:500">${m.label}</td>
            <td style="text-align:right" class="amount">¥${m.revenue.toLocaleString()}</td>
            <td style="text-align:right" class="amount">¥${m.payout.toLocaleString()}</td>
            <td style="text-align:center">${m.paid ? '<span class="badge-paid">✓ 精算済み</span>' : '<span class="badge-unpaid">○ 未精算</span>'}</td>
          </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:32px">売上データがありません</td></tr>'}</tbody>
      </table>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:16px">データ更新日時：${fmtDate(viewData.generatedAt)}</p>
  `;
}

// ===== 管理者ビュー =====
function showAdminScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'block';
  document.getElementById('admin-badge').style.display = 'inline-block';

  const sellers = viewData.sellers || [];

  // 全体サマリー
  const totalRev  = sellers.reduce((sum,s) => sum + (s.months||[]).reduce((a,m)=>a+m.revenue,0), 0);
  const totalPay  = sellers.reduce((sum,s) => sum + (s.months||[]).reduce((a,m)=>a+m.payout,0), 0);
  const unpaidAll = sellers.reduce((sum,s) => sum + (s.months||[]).filter(m=>!m.paid).length, 0);

  const rows = sellers.map((s,i) => {
    const months = (s.months||[]).slice().sort((a,b)=>b.monthId.localeCompare(a.monthId));
    const rev   = months.reduce((sum,m)=>sum+m.revenue,0);
    const pay   = months.reduce((sum,m)=>sum+m.payout,0);
    const unpd  = months.filter(m=>!m.paid).length;
    const detailId = 'detail-'+i;

    const detailRows = months.map(m=>`
      <tr>
        <td style="padding-left:28px">${m.label}</td>
        <td style="text-align:right">¥${m.revenue.toLocaleString()}</td>
        <td style="text-align:right">¥${m.payout.toLocaleString()}</td>
        <td style="text-align:center">${m.paid ? '<span class="badge-paid">✓ 精算済み</span>' : '<span class="badge-unpaid">○ 未精算</span>'}</td>
      </tr>`).join('');

    return `
      <tr class="seller-row" onclick="toggleDetail('${detailId}', this)">
        <td>${s.name} <span class="toggle-icon" id="icon-${detailId}">▶</span></td>
        <td style="text-align:right">¥${rev.toLocaleString()}</td>
        <td style="text-align:right">¥${pay.toLocaleString()}</td>
        <td style="text-align:center">${unpd > 0 ? `<span class="badge-unpaid">${unpd}ヶ月</span>` : '<span class="badge-paid">全精算済</span>'}</td>
      </tr>
      <tr class="detail-row" id="${detailId}">
        <td colspan="4">
          <div class="detail-inner">
            <table>
              <thead><tr><th style="padding-left:28px">月</th><th style="text-align:right">売上</th><th style="text-align:right">振込額</th><th style="text-align:center">精算状況</th></tr></thead>
              <tbody>${detailRows || '<tr><td colspan="4" style="text-align:center;padding:12px;color:var(--muted)">データなし</td></tr>'}</tbody>
            </table>
          </div>
        </td>
      </tr>`;
  }).join('');

  const ms = document.getElementById('main-screen');
  ms.style.display = 'block';
  ms.innerHTML = `
    <div class="welcome">全販売者 <span>売上一覧</span></div>
    <div class="summary-bar">
      <div class="summary-item"><div class="s-label">全体売上合計</div><div class="s-value">¥${totalRev.toLocaleString()}</div></div>
      <div class="summary-item"><div class="s-label">全体振込合計</div><div class="s-value">¥${totalPay.toLocaleString()}</div></div>
      <div class="summary-item"><div class="s-label">未精算（全体）</div><div class="s-value unpaid">${unpaidAll}ヶ月</div></div>
    </div>
    <div class="card">
      <div class="card-title">👥 販売者別売上（名前をクリックで月別展開）</div>
      <table>
        <thead><tr><th>販売者名</th><th style="text-align:right">累計売上</th><th style="text-align:right">累計振込額</th><th style="text-align:center">未精算</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--muted)">データがありません</td></tr>'}</tbody>
      </table>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:16px">データ更新日時：${fmtDate(viewData.generatedAt)}</p>
  `;
}

function toggleDetail(id, row) {
  const detail = document.getElementById(id);
  const icon = document.getElementById('icon-' + id);
  const open = detail.style.display === 'table-row';
  detail.style.display = open ? 'none' : 'table-row';
  icon.textContent = open ? '▶' : '▼';
}

function logout() {
  isAdmin = false;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('main-screen').innerHTML = '';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('admin-badge').style.display = 'none';
  document.getElementById('login-id').value = '';
  document.getElementById('login-pw').value = '';
  document.getElementById('login-screen').style.display = 'flex';
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ja-JP') + ' ' + d.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
}

loadData();
</script>
</body>
</html>
