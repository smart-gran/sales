<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavique 売上確認</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf8f5; --warm-white: #fff9f5; --blush: #e8d5c8; --rose: #c9a090;
  --deep-rose: #a0695a; --mauve: #7d5a6a; --deep: #3d2b35; --text: #2c1f26;
  --muted: #8a7070; --border: #e0cfc8; --light-border: #efe6e0; --accent: #c9847a;
  --success: #7aaa8a; --warning: #d4a85a;
  --shadow: 0 2px 12px rgba(61,43,53,0.08); --shadow-lg: 0 8px 32px rgba(61,43,53,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

/* ヘッダー */
.app-header { background: var(--deep); color: white; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 16px rgba(0,0,0,0.2); }
.header-title { font-family: 'Noto Serif JP', serif; font-size: 18px; font-weight: 500; letter-spacing: 0.05em; }
.header-sub { font-size: 11px; color: var(--blush); margin-top: 2px; }
.admin-badge { font-size: 11px; background: var(--deep-rose); color: white; padding: 3px 10px; border-radius: 12px; font-weight: 600; display: none; }
.logout-btn { background: none; border: 1px solid var(--blush); color: var(--blush); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; display: none; }
.logout-btn:hover { background: rgba(255,255,255,0.1); }

/* ログイン */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 70px); padding: 32px 20px; }
.login-card { background: white; border-radius: 16px; box-shadow: var(--shadow-lg); padding: 40px 36px; width: 100%; max-width: 400px; }
.login-card h2 { font-family: 'Noto Serif JP', serif; font-size: 17px; font-weight: 500; color: var(--deep); margin-bottom: 28px; text-align: center; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.form-group label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.form-group input { padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--text); background: var(--warm-white); outline: none; transition: all 0.2s; }
.form-group input:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(201,160,144,0.15); }
.btn-login { width: 100%; padding: 13px; background: var(--deep-rose); color: white; border: none; border-radius: 10px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
.btn-login:hover { background: var(--mauve); }
.login-err { color: #c05050; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

/* メイン */
#main-screen { display: none; padding: 28px 24px; max-width: 900px; margin: 0 auto; }
.welcome { font-family: 'Noto Serif JP', serif; font-size: 20px; font-weight: 500; color: var(--deep); margin-bottom: 24px; }
.welcome span { color: var(--deep-rose); }

.summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
.summary-item { background: white; border-radius: 12px; border: 1px solid var(--light-border); box-shadow: var(--shadow); padding: 16px 20px; text-align: center; }
.s-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.s-value { font-size: 20px; font-weight: 600; color: var(--deep); font-family: 'Noto Serif JP', serif; }
.s-value.unpaid { color: var(--warning); }

.card { background: white; border-radius: 12px; border: 1px solid var(--light-border); box-shadow: var(--shadow); padding: 24px 28px; margin-bottom: 20px; }
.card-title { font-family: 'Noto Serif JP', serif; font-size: 15px; font-weight: 500; color: var(--deep); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--light-border); }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--light-border); }
td { padding: 13px 12px; border-bottom: 1px solid var(--light-border); font-size: 14px; vertical-align: middle; }
tr:last-child > td { border-bottom: none; }
.badge-paid { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #e8f5ee; color: #3a8a5a; }
.badge-unpaid { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #fff6e0; color: #a07010; }
.muted { color: var(--muted); }
.amt { font-weight: 600; }

/* クリック展開行 */
.clickable-row { cursor: pointer; }
.clickable-row:hover td { background: #fdf5f0; }
.toggle-icon { font-size: 11px; color: var(--muted); margin-left: 8px; transition: transform 0.2s; }
.expand-row { display: none; }
.expand-row > td { padding: 0; }
.expand-inner { background: var(--cream); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

/* 精算書ドキュメント */
.seisan-doc { padding: 28px 28px 20px; background: white; }
.seisan-doc-title { font-size: 17px; font-weight: 700; text-align: center; color: var(--deep); margin-bottom: 12px; letter-spacing: 0.04em; }
.seisan-doc-divider { border: none; border-top: 2px solid var(--rose); margin-bottom: 16px; }
.seisan-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 12px; }
.seisan-recipient { font-size: 16px; font-weight: 700; color: var(--deep); }
.seisan-issuer { text-align: right; font-size: 12px; color: var(--muted); line-height: 2; }
.seisan-period { border: 1px solid var(--light-border); border-radius: 8px; padding: 10px 16px; margin-bottom: 18px; font-size: 13px; color: var(--deep); }
.seisan-period strong { color: var(--deep-rose); margin-right: 8px; font-size: 12px; }
/* 商品テーブル */
.sp-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.sp-table thead th { background: var(--deep); color: white; font-size: 12px; font-weight: 500; padding: 10px 14px; text-align: left; }
.sp-table thead th.r { text-align: right; }
.sp-table tbody td { padding: 11px 14px; border-bottom: 1px solid var(--light-border); font-size: 13px; }
.sp-table tbody td.r { text-align: right; font-variant-numeric: tabular-nums; }
.sp-table tfoot td { padding: 11px 14px; background: var(--blush); font-weight: 700; font-size: 13px; border-top: 2px solid var(--rose); }
.sp-table tfoot td.r { text-align: right; font-variant-numeric: tabular-nums; }
.sp-table .zero-item td { color: var(--muted); font-style: italic; }
/* 計算欄 */
.sp-calc { border: 1px solid var(--light-border); border-radius: 0; overflow: hidden; margin-bottom: 14px; }
.sp-calc-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--light-border); font-size: 13px; gap: 12px; }
.sp-calc-row:last-child { border-bottom: none; }
.sp-calc-row .lbl { color: var(--text); flex-shrink: 0; }
.sp-calc-row .sub { font-size: 11px; color: var(--muted); flex: 1; text-align: center; }
.sp-calc-row .val { font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.sp-calc-row.final-row { background: #fff0eb; padding: 13px 16px; }
.sp-calc-row.final-row .lbl { color: var(--deep-rose); font-weight: 700; font-size: 14px; }
.sp-calc-row.final-row .val { color: var(--deep-rose); font-size: 17px; }
.sp-calc-row .val.muted { color: var(--muted); font-weight: 400; }
.carry-tag { font-size: 10px; background: #fff3e0; color: #a06020; padding: 1px 6px; border-radius: 8px; margin-left: 6px; font-weight: 600; }
/* フッター注記 */
.sp-notes { font-size: 11px; color: var(--muted); line-height: 2; margin-top: 12px; }
.sp-date { text-align: right; font-size: 11px; color: var(--muted); margin-top: 10px; }
/* 管理者ビュー：販売者ヘッダー */
.seller-section-header { padding: 10px 28px 4px; font-size: 12px; font-weight: 700; color: var(--deep-rose); border-bottom: 1px solid var(--light-border); background: rgba(201,160,144,0.06); }
.zero-row td { color: var(--muted); font-style: italic; }

#loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
#error-msg { text-align: center; padding: 60px 20px; color: #c05050; font-size: 14px; display: none; }

@media (max-width: 480px) {
  .app-header { padding: 14px 18px; }
  #main-screen { padding: 18px 14px; }
  .summary-bar { grid-template-columns: 1fr 1fr; }
  .card { padding: 18px 16px; }
  td, th { padding: 9px 8px; font-size: 12px; }
  .seisan-wrap { padding: 14px 12px; }
}
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="header-title">Lavique 委託販売</div>
    <div class="header-sub">売上確認ページ</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="admin-badge" id="admin-badge">管理者</span>
    <button class="logout-btn" id="logout-btn" onclick="logout()">ログアウト</button>
  </div>
</div>

<div id="loading">データを読み込んでいます…</div>
<div id="error-msg">データの読み込みに失敗しました。<br>管理者にお問い合わせください。</div>

<div id="login-screen" style="display:none">
  <div class="login-card">
    <h2>🔑 ログイン</h2>
    <div class="form-group">
      <label>ID</label>
      <input type="text" id="login-id" placeholder="ログインIDを入力" autocomplete="username">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="login-pw" placeholder="パスワードを入力" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="login-err">IDまたはパスワードが正しくありません</div>
  </div>
</div>

<div id="main-screen"></div>

<script>
let viewData = null;

/* ---------- データ読み込み ---------- */
async function loadData() {
  try {
    const res = await fetch('./sales_data.json?v=' + Date.now());
    if (!res.ok) throw new Error();
    viewData = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
  }
}

/* ---------- ログイン ---------- */
function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('login-err');
  if (!viewData) return;

  if (viewData.admin && id === viewData.admin.loginId && pw === viewData.admin.loginPw) {
    err.style.display = 'none';
    showAdminScreen();
    return;
  }
  const seller = viewData.sellers.find(s => s.loginId === id && s.loginPw === pw);
  if (!seller) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  showSellerScreen(seller);
}

function logout() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('main-screen').innerHTML = '';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('admin-badge').style.display = 'none';
  document.getElementById('login-id').value = '';
  document.getElementById('login-pw').value = '';
  document.getElementById('login-screen').style.display = 'flex';
}

/* ---------- 精算書HTML生成（共通） ---------- */
// sellerName: 販売者名（文字列）/ showHeader: ドキュメントヘッダーを表示するか
function buildSeisanHTML(m, sellerName, showHeader) {
  const items      = m.items || [];
  const tRev       = m.revenue || 0;
  const tQty       = items.reduce((s,r) => s + (r.qty||0), 0);
  const rate       = (m.rate != null && m.rate > 0) ? m.rate : 0.2;
  const comm       = Math.round(tRev * rate);   // 常に再計算（exportedの値に依存しない）
  const payout     = tRev - comm;
  const carryovers = m.carryovers || [];
  const carryTotal = carryovers.reduce((s,c) => s + c.payout, 0);
  const carryPayout= payout + carryTotal;
  const tfee       = m.tfee != null ? m.tfee : (carryPayout < 20000 ? 300 : 0);
  const final      = m.final != null ? m.final : Math.max(0, carryPayout - tfee);
  const rateLabel  = Math.round(rate * 100) + '%';
  const today      = new Date().toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric'});

  // 商品明細
  const itemRows = items.length
    ? items.map(r => r.qty === 0
        ? `<tr class="zero-item"><td>${esc(r.name)}</td><td class="r">¥${(r.price||0).toLocaleString()}</td><td class="r">0</td><td class="r">¥0</td></tr>`
        : `<tr><td>${esc(r.name)}</td><td class="r">¥${(r.price||0).toLocaleString()}</td><td class="r">${r.qty}</td><td class="r" style="font-weight:600">¥${(r.revenue||0).toLocaleString()}</td></tr>`
      ).join('')
    : `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px;font-size:12px">商品データなし（管理者にご確認ください）</td></tr>`;

  // 計算欄
  const calcRows = [];
  calcRows.push({ lbl:'当月売上合計', sub:'', val:`¥${tRev.toLocaleString()}` });
  calcRows.push({ lbl:`販売手数料(${rateLabel})`, sub:`${tRev.toLocaleString()} × ${rateLabel}`, val:`¥${comm.toLocaleString()}` });
  calcRows.push({ lbl:'支払対象額', sub:`${tRev.toLocaleString()} − ${comm.toLocaleString()}`, val:`¥${payout.toLocaleString()}` });
  carryovers.forEach(c => {
    calcRows.push({ lbl:`繰越（${c.label}）`, sub:'前月未払い分', val:`¥${c.payout.toLocaleString()}`, carry:true });
  });
  if (tfee > 0) {
    calcRows.push({ lbl:'振込手数料', sub:'20,000円未満のためご負担', val:`¥${tfee.toLocaleString()}` });
  } else {
    calcRows.push({ lbl:'振込手数料', sub:'当方負担', val:'¥0', zero:true });
  }
  const calcHTML = calcRows.map(r =>
    `<div class="sp-calc-row">
      <span class="lbl">${esc(r.lbl)}${r.carry?'<span class="carry-tag">繰越</span>':''}</span>
      <span class="sub">${esc(r.sub||'')}</span>
      <span class="val${r.zero?' muted':''}">${r.val}</span>
    </div>`
  ).join('');

  const noteHtml = tRev > 0 ? `
    <div class="sp-notes">
      当月分の精算金額は上記の通りとなります。<br>
      ・20,000円未満の場合：振込手数料300円をご負担いただきます<br>
      ・20,000円以上の場合：振込手数料は当方にて負担いたします<br><br>
      今月15日までに振込希望の旨と振込先銀行を転写紙協会のLINEにてご連絡ください。
    </div>
    <div class="sp-date">発行日：${today}</div>` : '';

  const headerHtml = showHeader ? `
    <div class="seisan-doc-title">Lavique ECショップ　委託販売 月次精算書</div>
    <hr class="seisan-doc-divider">
    <div class="seisan-meta">
      <div class="seisan-recipient">${esc(sellerName||'')}　様</div>
      <div class="seisan-issuer">Lavique・後藤あい<br>広島県福山市南蔵王町2丁目3-35<br>TEL: 080-3894-4100</div>
    </div>
    <div class="seisan-period"><strong>精算対象期間：</strong>${esc(m.label)}</div>` : '';

  return `
    <div class="seisan-doc">
      ${headerHtml}
      <table class="sp-table">
        <thead><tr>
          <th>商品名</th><th class="r">単価(A)</th><th class="r">販売数(B)</th><th class="r">売上金額(C)</th>
        </tr></thead>
        <tbody>${itemRows}</tbody>
        <tfoot><tr>
          <td colspan="2" style="font-weight:700">合計</td>
          <td class="r">${tQty}</td>
          <td class="r">¥${tRev.toLocaleString()}</td>
        </tr></tfoot>
      </table>
      <div class="sp-calc">
        ${calcHTML}
        <div class="sp-calc-row final-row">
          <span class="lbl">最終振込金額</span>
          <span class="sub"></span>
          <span class="val">¥${final.toLocaleString()}</span>
        </div>
      </div>
      ${noteHtml}
    </div>`;
}

/* ---------- 販売者ビュー ---------- */
function showSellerScreen(s) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'block';

  const months  = (s.months || []).slice().sort((a,b) => b.monthId.localeCompare(a.monthId));
  const totalRev = months.reduce((sum,m) => sum + m.revenue, 0);
  const totalPay = months.reduce((sum,m) => sum + m.payout, 0);
  const unpaid   = months.filter(m => !m.paid && m.revenue > 0).length;

  const monthRows = months.map((m, i) => {
    const detId = 'sv-' + i;
    const isZero = m.revenue === 0;
    return `
      <tr class="clickable-row${isZero?' zero-row':''}" onclick="toggleExpand('${detId}',this)">
        <td style="font-weight:${isZero?'400':'600'}">${esc(m.label)}<span class="toggle-icon" id="icon-${detId}">▶</span></td>
        <td style="text-align:right" class="amt ${isZero?'muted':''}">¥${m.revenue.toLocaleString()}</td>
        <td style="text-align:right" class="amt ${isZero?'muted':''}">¥${m.payout.toLocaleString()}</td>
        <td style="text-align:center">${isZero
          ? '<span style="font-size:12px;color:var(--muted)">—</span>'
          : (m.paid ? '<span class="badge-paid">✓ 精算済み</span>' : '<span class="badge-unpaid">○ 未精算</span>')}</td>
      </tr>
      <tr class="expand-row" id="${detId}">
        <td colspan="4">
          <div class="expand-inner">${buildSeisanHTML(m, s.name, true)}</div>
        </td>
      </tr>`;
  }).join('');

  const ms = document.getElementById('main-screen');
  ms.style.display = 'block';
  ms.innerHTML = `
    <div class="welcome">こんにちは、<span>${esc(s.name)}</span>さん</div>
    <div class="summary-bar">
      <div class="summary-item"><div class="s-label">累計売上</div><div class="s-value">¥${totalRev.toLocaleString()}</div></div>
      <div class="summary-item"><div class="s-label">累計振込額</div><div class="s-value">¥${totalPay.toLocaleString()}</div></div>
      <div class="summary-item"><div class="s-label">未精算月</div><div class="s-value unpaid">${unpaid}ヶ月</div></div>
    </div>
    <div class="card">
      <div class="card-title">📅 月別売上・精算状況（月をクリックで明細を表示）</div>
      <table>
        <thead><tr>
          <th>月</th>
          <th style="text-align:right">売上</th>
          <th style="text-align:right">振込額</th>
          <th style="text-align:center">精算状況</th>
        </tr></thead>
        <tbody>
          ${months.length ? monthRows : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:32px">データがありません</td></tr>'}
        </tbody>
      </table>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:16px">データ更新日時：${fmtDate(viewData.generatedAt)}</p>
  `;
}

/* ---------- 管理者ビュー ---------- */
function showAdminScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'block';
  document.getElementById('admin-badge').style.display = 'inline-block';

  const sellers = viewData.sellers || [];

  // 月→販売者マップ
  const monthMap = {};
  sellers.forEach(s => {
    (s.months || []).forEach(m => {
      if (!monthMap[m.monthId]) monthMap[m.monthId] = { label: m.label, items: [] };
      monthMap[m.monthId].items.push({ name: s.name, ...m });
    });
  });
  const sortedMonths = Object.keys(monthMap).sort((a,b) => b.localeCompare(a));

  // 全体サマリー
  const totalRev  = sellers.reduce((sum,s) => sum + (s.months||[]).reduce((a,m)=>a+m.revenue,0), 0);
  const totalPay  = sellers.reduce((sum,s) => sum + (s.months||[]).reduce((a,m)=>a+m.payout,0), 0);
  const unpaidAll = sellers.reduce((sum,s) => sum + (s.months||[]).filter(m=>!m.paid&&m.revenue>0).length, 0);

  const monthRows = sortedMonths.map((mid, i) => {
    const mo = monthMap[mid];
    const mRev   = mo.items.reduce((sum,s)=>sum+s.revenue,0);
    const mPay   = mo.items.reduce((sum,s)=>sum+s.payout,0);
    const unpaid  = mo.items.filter(s=>!s.paid&&s.revenue>0).length;
    const paidCnt = mo.items.filter(s=>s.paid&&s.revenue>0).length;
    const total   = mo.items.filter(s=>s.revenue>0).length;
    const detId   = 'mo-' + i;

    // 精算書（販売者ごと）
    const sellerSeisan = mo.items.map(s => {
      if (s.revenue === 0) {
        return `<div style="padding:12px 24px;border-bottom:1px solid var(--light-border);color:var(--muted);font-size:12px;font-style:italic">
          ${esc(s.name)}：売上なし（¥0）</div>`;
      }
      return `<div style="border-bottom:2px solid var(--border)">
        ${buildSeisanHTML(s, s.name, true)}
      </div>`;
    }).join('');

    const statusBadge = total === 0
      ? '<span style="font-size:12px;color:var(--muted)">—</span>'
      : paidCnt === total
        ? '<span class="badge-paid">全員精算済</span>'
        : `<span class="badge-unpaid">${unpaid}名 未精算</span>`;

    return `
      <tr class="clickable-row" onclick="toggleExpand('${detId}', this)">
        <td style="font-weight:600">${esc(mo.label)}<span class="toggle-icon" id="icon-${detId}">▶</span></td>
        <td style="text-align:right" class="amt ${mRev===0?'muted':''}">¥${mRev.toLocaleString()}</td>
        <td style="text-align:right" class="amt ${mRev===0?'muted':''}">¥${mPay.toLocaleString()}</td>
        <td style="text-align:center">${statusBadge}</td>
      </tr>
      <tr class="expand-row" id="${detId}">
        <td colspan="4">
          <div class="expand-inner">${sellerSeisan}</div>
        </td>
      </tr>`;
  }).join('');

  const ms = document.getElementById('main-screen');
  ms.style.display = 'block';
  ms.innerHTML = `
    <div class="welcome">全販売者 <span>月別売上一覧</span></div>
    <div class="summary-bar">
      <div class="summary-item"><div class="s-label">全体売上合計</div><div class="s-value">¥${totalRev.toLocaleString()}</div></div>
      <div class="summary-item"><div class="s-label">全体振込合計</div><div class="s-value">¥${totalPay.toLocaleString()}</div></div>
      <div class="summary-item"><div class="s-label">未精算（全体）</div><div class="s-value unpaid">${unpaidAll}件</div></div>
    </div>
    <div class="card">
      <div class="card-title">📅 月別売上・精算状況（月をクリックで精算書を表示）</div>
      <table>
        <thead><tr>
          <th>月</th>
          <th style="text-align:right">売上合計</th>
          <th style="text-align:right">振込合計</th>
          <th style="text-align:center">精算状況</th>
        </tr></thead>
        <tbody>
          ${monthRows || '<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--muted)">データがありません</td></tr>'}
        </tbody>
      </table>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:16px">データ更新日時：${fmtDate(viewData.generatedAt)}</p>
  `;
}

/* ---------- 展開トグル ---------- */
function toggleExpand(id, row) {
  const detail = document.getElementById(id);
  const icon   = document.getElementById('icon-' + id);
  const open   = detail.style.display === 'table-row';
  detail.style.display = open ? 'none' : 'table-row';
  icon.textContent = open ? '▶' : '▼';
}

/* ---------- ユーティリティ ---------- */
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ja-JP') + ' ' + d.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadData();
</script>
</body>
</html>
